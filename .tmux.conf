# Use bash shell
set -g default-shell ${SHELL}
set -g default-command ${SHELL}
# Use screen colors
#set -g default-terminal "screen-256color"
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

# make ctrl + space leader
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix 
# use vi mode in command prompt
set -g status-keys vi

# Use Mouse
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# Copy mode
set -g set-clipboard on
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# window & pane management

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D 
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt-arrow to switch windows
bind -n M-Left  previous-window
bind -n M-Right next-window

# Make shortcuts to use curret path - similar to tmux commands
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Make terminal Tab name = Tmux session name
set-option -g set-titles on
set-option -g set-titles-string "#{session_name}"

# Cheatsheet
# Prefix: C-Space
#
# Commands                                  | Shortcuts
# ----------------------------------------- | ----------------------------------
# new-session -s <name> / new -s <name>     | Shell: tmux new -s <name>
# attach-session -t <name> / a -t <name>    | Shell: tmux a -t <name>
# detach-client / detach                   | Prefix + d
# list-sessions / ls                        | Shell: tmux ls
# choose-tree -s                           | Prefix + s
# rename-session -t <old> <new> / rename    | Prefix + $
# kill-session -t <name> / kill             | Prefix + :kill-session
# kill-server                               | Prefix + :kill-server
#
# new-window / neww                         | Prefix + c
# select-window -t <index> / selectw        | Prefix + <window index>
# next-window / next                        | Prefix + n
# previous-window / prev                    | Prefix + p
# list-windows / lsw                        | Shell: tmux lsw
# choose-tree -w                           | Prefix + w
# rename-window -t <name> / renamew         | Prefix + ,
#
# split-window -h / splitw -h               | Prefix + %
# split-window -v / splitw -v               | Prefix + "
# select-pane -L/-D/-U/-R / selectp         | Prefix + h/j/k/l or arrow
# select-pane -l / selectp -l               | Prefix + ;
# select-pane -t <index> / selectp          | Prefix + q, then <pane index>
# select-pane -t :.+ / selectp -t :.+       | Prefix + o
# resize-pane -L/-D/-U/-R / resizep         | Prefix + C-arrow
#
# command-prompt                            | Prefix + :
# display-panes / displayp                  | Prefix + q
# copy-mode / copy                          | Prefix + [
# paste-buffer / pasteb                     | Prefix + ]
#
# Keys without the prefix
# select-pane -L/-D/-U/-R / selectp         | Alt + h/j/k/l
# previous-window / prev                    | Alt + Left
# next-window / next                        | Alt + Right
#
# Mouse
# Select panes, resize panes, and use the window context menu with right-click.
