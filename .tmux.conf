# Use bash shell
set -g default-shell ${SHELL}
set -g default-command ${SHELL}
# Use screen colors
set -g default-terminal "screen-256color"

# make ctrl + space leader
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix 
# use vi mode in command prompt
set -g status-keys vi

# Use Mouse
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# Copy mode
set -g set-clipboard on
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# window & pane management

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D 
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt-arrow to switch windows
bind -n M-Left  previous-window
bind -n M-Right next-window

# Make shortcuts to use curret path - similar to tmux commands
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Cheatsheet

# Commands
# tmux new -s <session-name>
# tmux new-window
# tmux split-window -h/v
# exit // to kill each pane to exit session
# tmux list-session // list all running session. Useful for sanity check

# Session Management
# tmux rename-session -t <old> <new>  // rename session from terminal
# tmux kill-session -t <name>         // kill a specific session
# tmux kill-server                    // kill all sessions

# Shortcuts
# C-b c             // create a new window
# C-b <window index> // to switch between windows
# C-b : // command mode. execute above commands without tmux prefix
# C-b $             // rename current session
# C-b :kill-session // kill current session
# C-b s             // list sessions
# C-b w             // list windows
# C-b q             // show pane numbers (press number to jump)
# C-b "             // split pane horizontally (top/bottom)
# C-b %             // split pane vertically (left/right)
# C-b o             // move to next pane
# C-b ;             // move to last active pane
# C-b arrow         // move to pane by direction

